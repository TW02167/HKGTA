<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>香港狂飆 852 - Hong Kong Open World 3D</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Tone.js Audio Synthesizer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Noto+Sans+TC:wght@500;800;900&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #05050d;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Neon Text Glow Effects */
        .neon-glow-red {
            text-shadow: 0 0 5px #ff2a6d, 0 0 10px #ff2a6d, 0 0 20px #ff2a6d, 0 0 40px #ff2a6d;
        }
        .neon-glow-cyan {
            text-shadow: 0 0 5px #05d9e8, 0 0 10px #05d9e8, 0 0 20px #05d9e8, 0 0 40px #05d9e8;
        }
        .neon-glow-yellow {
            text-shadow: 0 0 5px #ffb900, 0 0 10px #ffb900, 0 0 20px #ffb900;
        }

        /* Glassmorphism UI Panels */
        .glass-panel {
            background: rgba(15, 20, 32, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Minimap Radar Styling */
        #minimap-container {
            border: 3px solid rgba(5, 217, 232, 0.6);
            box-shadow: 0 0 15px rgba(5, 217, 232, 0.3);
            border-radius: 50%;
            overflow: hidden;
        }

        /* Hide scrollbars */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-black text-white antialiased overflow-hidden">

    <!-- Main Render Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- UI Overlay Layer -->
    <div id="ui-container" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4 z-10">
        
        <!-- Top Header Bar -->
        <div class="flex justify-between items-start w-full">
            <!-- Left Info: HKD Cash, Health, Wanted Level -->
            <div class="flex flex-col gap-2 pointer-events-auto">
                <!-- Title & Location -->
                <div class="glass-panel px-4 py-2 rounded-xl flex items-center gap-3">
                    <span class="text-2xl font-black tracking-widest text-red-500 neon-glow-red">香港狂飆 852</span>
                    <span id="current-district" class="bg-cyan-950 text-cyan-400 text-xs px-2 py-1 rounded font-bold border border-cyan-800">旺角 MONG KOK</span>
                </div>

                <!-- Cash & Health -->
                <div class="flex gap-3">
                    <div class="glass-panel px-4 py-2 rounded-xl flex items-center gap-2 border-emerald-500/40">
                        <i class="fa-solid fa-dollar-sign text-emerald-400 text-xl"></i>
                        <span id="cash-display" class="text-2xl font-black text-emerald-400 font-mono">HK$ 1,852</span>
                    </div>
                    <div class="glass-panel px-4 py-2 rounded-xl flex items-center gap-2 border-red-500/40 w-36">
                        <i class="fa-solid fa-heart text-red-500 text-lg"></i>
                        <div class="w-full bg-gray-800 h-3 rounded-full overflow-hidden border border-gray-700">
                            <div id="health-bar" class="bg-gradient-to-r from-red-600 to-red-400 h-full w-full transition-all duration-300"></div>
                        </div>
                    </div>
                </div>

                <!-- Radio Station Widget -->
                <div class="glass-panel px-3 py-1.5 rounded-lg flex items-center gap-2 border-purple-500/30 text-xs">
                    <i class="fa-solid fa-radio text-purple-400 animate-pulse"></i>
                    <span class="text-gray-400">RADIO:</span>
                    <span id="radio-display" class="font-bold text-purple-300">852 CANTO-SYNTH FM</span>
                </div>
            </div>

            <!-- Right Top: Wanted Level Stars & Mission Banner -->
            <div class="flex flex-col items-end gap-2 pointer-events-auto">
                <!-- Wanted Stars -->
                <div class="glass-panel px-4 py-2 rounded-xl flex items-center gap-1.5 border-yellow-500/30">
                    <span class="text-xs font-bold text-gray-400 mr-1">WANTED</span>
                    <div id="stars-container" class="flex gap-1 text-lg text-gray-600">
                        <i class="fa-solid fa-star star-1"></i>
                        <i class="fa-solid fa-star star-2"></i>
                        <i class="fa-solid fa-star star-3"></i>
                        <i class="fa-solid fa-star star-4"></i>
                        <i class="fa-solid fa-star star-5"></i>
                    </div>
                </div>

                <!-- Active Mission Card -->
                <div id="mission-card" class="glass-panel p-3 rounded-xl max-w-xs border-amber-500/50 flex flex-col gap-1 transition-all">
                    <div class="flex justify-between items-center text-xs text-amber-400 font-bold uppercase tracking-wider">
                        <span><i class="fa-solid fa-bullseye mr-1"></i> CURRENT JOB</span>
                        <span id="mission-timer" class="font-mono text-white bg-amber-600 px-1.5 py-0.5 rounded hidden">60s</span>
                    </div>
                    <div id="mission-title" class="font-bold text-sm text-white">🧋 Milk Tea Delivery</div>
                    <div id="mission-desc" class="text-xs text-gray-300">Deliver hot pineapple buns & milk tea to Cha Chaan Teng in Mong Kok!</div>
                </div>
            </div>
        </div>

        <!-- Center Notification Popup -->
        <div id="interaction-prompt" class="self-center glass-panel px-6 py-3 rounded-2xl border-cyan-400/60 text-cyan-300 font-bold text-sm flex items-center gap-3 opacity-0 transition-all duration-300 transform translate-y-4">
            <span class="bg-cyan-500 text-black px-2 py-0.5 rounded text-xs font-black uppercase">KEY [E] / TAP</span>
            <span id="prompt-text">Drive HK Red Taxi</span>
        </div>

        <!-- Bottom Controls & Radar Bar -->
        <div class="flex justify-between items-end w-full">
            <!-- Bottom Left: Radar Minimap -->
            <div class="pointer-events-auto relative">
                <div id="minimap-container" class="w-32 h-32 md:w-40 md:h-40 bg-slate-900/90 relative">
                    <canvas id="minimap-canvas" class="w-full h-full"></canvas>
                    <!-- Center Player Icon -->
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <div class="w-3 h-3 bg-cyan-400 border-2 border-white rounded-full shadow-[0_0_10px_#05d9e8]"></div>
                    </div>
                </div>
                <div class="text-[10px] text-gray-400 font-mono mt-1 text-center font-bold">VICTORIA HARBOUR REGION</div>
            </div>

            <!-- Vehicle Speedometer (Visible when driving) -->
            <div id="speedometer-panel" class="glass-panel px-6 py-3 rounded-2xl border-red-500/40 flex items-baseline gap-2 hidden">
                <span id="speed-value" class="text-4xl font-black font-mono text-red-500 neon-glow-red">0</span>
                <span class="text-xs font-bold text-gray-400">KM/H</span>
                <span id="vehicle-type-label" class="ml-2 text-xs bg-red-950 text-red-300 px-2 py-0.5 rounded uppercase font-bold">RED TAXI</span>
            </div>

            <!-- Action Quick Buttons (Touch / Mouse interactive) -->
            <div class="pointer-events-auto flex flex-col gap-2">
                <button id="btn-interact" class="glass-panel hover:bg-cyan-500/20 active:scale-95 text-cyan-400 p-3 rounded-xl flex items-center justify-center gap-2 font-bold text-xs border-cyan-500/40 shadow-lg transition">
                    <i class="fa-solid fa-car-side text-lg"></i>
                    <span id="btn-interact-text">ENTER / EXIT</span>
                </button>
                <button id="btn-radio" class="glass-panel hover:bg-purple-500/20 active:scale-95 text-purple-300 p-3 rounded-xl flex items-center justify-center gap-2 font-bold text-xs border-purple-500/40 shadow-lg transition">
                    <i class="fa-solid fa-sliders text-lg"></i>
                    <span>RADIO [R]</span>
                </button>
            </div>
        </div>
    </div>

    <!-- On-Screen Virtual Touch Controller for Mobile -->
    <div id="touch-controls" class="absolute inset-0 pointer-events-none z-20 flex justify-between p-6 items-end md:hidden">
        <!-- Virtual D-Pad / Steering Joystick area -->
        <div class="pointer-events-auto flex gap-2">
            <button id="touch-left" class="w-16 h-16 glass-panel rounded-2xl flex items-center justify-center text-cyan-400 text-2xl active:bg-cyan-500/30"><i class="fa-solid fa-arrow-left"></i></button>
            <button id="touch-right" class="w-16 h-16 glass-panel rounded-2xl flex items-center justify-center text-cyan-400 text-2xl active:bg-cyan-500/30"><i class="fa-solid fa-arrow-right"></i></button>
        </div>
        <!-- Gas / Brake Pedals -->
        <div class="pointer-events-auto flex gap-2">
            <button id="touch-brake" class="w-16 h-16 glass-panel rounded-2xl flex items-center justify-center text-red-400 text-xl font-black active:bg-red-500/30">BRAKE</button>
            <button id="touch-gas" class="w-20 h-20 bg-emerald-600/80 rounded-2xl flex items-center justify-center text-white text-xl font-black active:bg-emerald-500 border border-emerald-400 shadow-lg">GAS</button>
        </div>
    </div>

    <!-- Notification Toast Modal -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 glass-panel px-6 py-3 rounded-2xl border-emerald-500/50 text-emerald-300 font-bold text-sm pointer-events-none opacity-0 transition-all duration-300 z-30 flex items-center gap-3 shadow-2xl">
        <i class="fa-solid fa-circle-check text-xl"></i>
        <span id="toast-msg">Mission Started!</span>
    </div>

    <script>
        // Game Engine Variables
        let scene, camera, renderer, clock;
        let minimapCanvas, minimapCtx;
        
        // Player & State
        let player, playerBody;
        let currentVehicle = null;
        let isDriving = false;
        let playerHealth = 100;
        let hkdCash = 1852;
        let wantedLevel = 0; // 0 to 5
        let currentDistrict = "旺角 MONG KOK";
        
        // Lists for animation & updates
        const vehicles = [];
        const buildings = [];
        const neonSigns = [];
        const policeCars = [];
        const activeMissions = [];
        const particleEffects = [];

        // Keyboard Input State
        const keys = {
            w: false, s: false, a: false, d: false,
            ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
            e: false, r: false, Space: false
        };

        // Radio Synthesizer State
        let currentRadioIdx = 0;
        const radioStations = [
            "852 CANTO-SYNTH FM",
            "VICTORIA HARBOUR LO-FI",
            "MONG KOK NIGHT BEATS"
        ];
        let audioSynth, engineSynth, sirenSynth;
        let isAudioStarted = false;

        function initEngine() {
            const container = document.getElementById('game-canvas');
            
            // Scene Setup with Night Cyberpunk Atmosphere
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x040612);
            scene.fog = new THREE.FogExp2(0x06091f, 0.008);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true, powerPreference: "highPerformance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            clock = new THREE.Clock();

            // Lighting Setup - Cyberpunk Neon Night Vibe
            const ambientLight = new THREE.AmbientLight(0x1a2238, 1.2);
            scene.add(ambientLight);

            const moonLight = new THREE.DirectionalLight(0x4060ff, 1.5);
            moonLight.position.set(100, 200, 100);
            moonLight.castShadow = true;
            moonLight.shadow.mapSize.width = 2048;
            moonLight.shadow.mapSize.height = 2048;
            scene.add(moonLight);

            // Victoria Harbour Glowing Horizon Light
            const harbourLight = new THREE.HemisphereLight(0xff2a6d, 0x05d9e8, 0.8);
            scene.add(harbourLight);

            // Minimap Canvas Initialization
            minimapCanvas = document.getElementById('minimap-canvas');
            minimapCanvas.width = 160;
            minimapCanvas.height = 160;
            minimapCtx = minimapCanvas.getContext('2d');

            // Build Hong Kong World Map
            buildHongKongWorld();

            // Create Player
            createPlayerCharacter();

            // Spawn Hong Kong Vehicles
            spawnHKTaxi(0, 0.5, 10);
            spawnHKMinibus(20, 0.5, -15);
            spawnHKDoubleDeckerBus(-25, 0.5, 30);
            spawnPoliceCar(-40, 0.5, -40);

            // Setup Controls & Events
            setupEventListeners();
            setupTouchControls();

            // Start Animation Loop
            animate();
        }

        function buildHongKongWorld() {
            // Ground / Asphalt Road Network
            const mapSize = 500;
            const groundGeo = new THREE.PlaneGeometry(mapSize, mapSize);
            const groundMat = new THREE.MeshStandardMaterial({
                color: 0x11131a,
                roughness: 0.4,
                metalness: 0.2
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Road Markings (Grid Layout)
            createRoadGrid(mapSize);

            // Victoria Harbour Water Edge
            createVictoriaHarbour();

            // Iconic Hong Kong Landmarks & City Blocks
            createSkyscrapers();
            createOverhangingNeonSigns();
            createHKStreetProps();
        }

        function createRoadGrid(mapSize) {
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x222530, roughness: 0.6 });
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 }); // HK Yellow road lines

            const gridSpacing = 60;
            for (let i = -mapSize / 2 + 30; i < mapSize / 2; i += gridSpacing) {
                // North-South Roads
                const roadNS = new THREE.Mesh(new THREE.PlaneGeometry(16, mapSize), roadMat);
                roadNS.rotation.x = -Math.PI / 2;
                roadNS.position.set(i, 0.01, 0);
                scene.add(roadNS);

                // East-West Roads
                const roadEW = new THREE.Mesh(new THREE.PlaneGeometry(mapSize, 16), roadMat);
                roadEW.rotation.x = -Math.PI / 2;
                roadEW.position.set(0, 0.01, i);
                scene.add(roadEW);

                // Yellow Center Lines
                const lineNS = new THREE.Mesh(new THREE.PlaneGeometry(0.6, mapSize), lineMat);
                lineNS.rotation.x = -Math.PI / 2;
                lineNS.position.set(i, 0.02, 0);
                scene.add(lineNS);
            }
        }

        function createVictoriaHarbour() {
            // Harbour Water Mesh
            const waterGeo = new THREE.PlaneGeometry(500, 150);
            const waterMat = new THREE.MeshStandardMaterial({
                color: 0x052a38,
                roughness: 0.1,
                metalness: 0.8,
                emissive: 0x021724
            });
            const water = new THREE.Mesh(waterGeo, waterMat);
            water.rotation.x = -Math.PI / 2;
            water.position.set(0, -0.2, -200);
            scene.add(water);

            // Star Ferry Pier Structure
            const pierGeo = new THREE.BoxGeometry(60, 8, 30);
            const pierMat = new THREE.MeshStandardMaterial({ color: 0x1f2e3d });
            const pier = new THREE.Mesh(pierGeo, pierMat);
            pier.position.set(0, 4, -120);
            pier.castShadow = true;
            scene.add(pier);

            // Tsim Sha Tsui Clock Tower
            const towerGeo = new THREE.BoxGeometry(10, 50, 10);
            const towerMat = new THREE.MeshStandardMaterial({ color: 0x8c6247 });
            const tower = new THREE.Mesh(towerGeo, towerMat);
            tower.position.set(-60, 25, -115);
            scene.add(tower);

            // Clock Tower Roof Spire
            const spireGeo = new THREE.ConeGeometry(6, 15, 4);
            const spireMat = new THREE.MeshStandardMaterial({ color: 0x2e423b });
            const spire = new THREE.Mesh(spireGeo, spireMat);
            spire.position.set(-60, 57.5, -115);
            scene.add(spire);
        }

        function createSkyscrapers() {
            const buildingColors = [0x121b29, 0x1a2638, 0x0d1520, 0x221c2e];
            const gridSpacing = 60;

            for (let x = -180; x <= 180; x += gridSpacing) {
                for (let z = -90; z <= 180; z += gridSpacing) {
                    // Skip road intersections
                    if (Math.abs(x % gridSpacing) < 10 || Math.abs(z % gridSpacing) < 10) continue;

                    const height = 40 + Math.random() * 80;
                    const width = 24 + Math.random() * 10;
                    const depth = 24 + Math.random() * 10;

                    const geo = new THREE.BoxGeometry(width, height, depth);
                    const mat = new THREE.MeshStandardMaterial({
                        color: buildingColors[Math.floor(Math.random() * buildingColors.length)],
                        roughness: 0.3,
                        metalness: 0.5
                    });

                    const bldg = new THREE.Mesh(geo, mat);
                    bldg.position.set(x + (Math.random() - 0.5) * 10, height / 2, z + (Math.random() - 0.5) * 10);
                    bldg.castShadow = true;
                    bldg.receiveShadow = true;
                    scene.add(bldg);

                    // Add Glowing Window Grids
                    addBuildingWindows(bldg, width, height, depth);

                    // Randomly add Bank of China / IFC style spire roof
                    if (Math.random() > 0.6) {
                        const roofGeo = new THREE.ConeGeometry(width / 2, 20, 4);
                        const roofMat = new THREE.MeshStandardMaterial({ color: 0x05d9e8, emissive: 0x02454a });
                        const roof = new THREE.Mesh(roofGeo, roofMat);
                        roof.position.set(bldg.position.x, height + 10, bldg.position.z);
                        scene.add(roof);
                    }
                }
            }
        }

        function addBuildingWindows(bldg, w, h, d) {
            // Window glowing light panels
            const winMat = new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0xffea79 : 0x05d9e8 });
            const winGeo = new THREE.PlaneGeometry(w * 0.8, h * 0.8);
            
            const winFront = new THREE.Mesh(winGeo, winMat);
            winFront.position.set(bldg.position.x, h / 2, bldg.position.z + d / 2 + 0.1);
            scene.add(winFront);
        }

        function createOverhangingNeonSigns() {
            const neonTexts = [
                { text: "茶餐廳", color: 0xff2a6d },
                { text: "旺角夜市", color: 0x05d9e8 },
                { text: "蘭桂坊", color: 0xffb900 },
                { text: "麻雀會館", color: 0x39ff14 },
                { text: "維多利亞", color: 0xd600ff },
                { text: "金牌點心", color: 0xff3300 }
            ];

            for (let i = 0; i < 24; i++) {
                const item = neonTexts[i % neonTexts.length];
                
                // Signboard Box Frame
                const signGeo = new THREE.BoxGeometry(14, 6, 0.8);
                const signMat = new THREE.MeshStandardMaterial({
                    color: 0x0a0a0a,
                    emissive: item.color,
                    emissiveIntensity: 0.8
                });
                const sign = new THREE.Mesh(signGeo, signMat);

                // Position cantilevered over street roads
                const posX = (Math.random() > 0.5 ? 1 : -1) * (20 + Math.random() * 120);
                const posZ = -80 + Math.random() * 240;
                sign.position.set(posX, 12 + Math.random() * 8, posZ);
                sign.rotation.y = (Math.random() > 0.5 ? 0 : Math.PI / 2);

                scene.add(sign);

                // Point Light source to cast colored neon glow onto vehicles below
                const neonLight = new THREE.PointLight(item.color, 2, 25);
                neonLight.position.set(sign.position.x, sign.position.y - 2, sign.position.z);
                scene.add(neonLight);
            }
        }

        function createHKStreetProps() {
            // HK Red Fire Hydrants & Trash Cans along roads
            for (let i = -150; i < 150; i += 40) {
                // Hydrant
                const hydGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.2, 8);
                const hydMat = new THREE.MeshStandardMaterial({ color: 0xcc0000 });
                const hydrant = new THREE.Mesh(hydGeo, hydMat);
                hydrant.position.set(i + 9, 0.6, i + 9);
                scene.add(hydrant);
            }
        }

        function createPlayerCharacter() {
            playerGroup = new THREE.Group();

            // Body / Jacket (Hong Kong Street Style Hoodie)
            const torsoGeo = new THREE.BoxGeometry(1, 1.4, 0.6);
            const torsoMat = new THREE.MeshStandardMaterial({ color: 0x05d9e8 });
            const torso = new THREE.Mesh(torsoGeo, torsoMat);
            torso.position.y = 1.4;
            playerGroup.add(torso);

            // Head
            const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffc09f });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.4;
            playerGroup.add(head);

            // Legs
            const legGeo = new THREE.BoxGeometry(0.4, 1.2, 0.4);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x111625 });
            const leftLeg = new THREE.Mesh(legGeo, legMat);
            leftLeg.position.set(-0.3, 0.6, 0);
            const rightLeg = new THREE.Mesh(legGeo, legMat);
            rightLeg.position.set(0.3, 0.6, 0);
            playerGroup.add(leftLeg);
            playerGroup.add(rightLeg);

            playerGroup.position.set(0, 0, 0);
            scene.add(playerGroup);
            player = playerGroup;
        }

        function spawnHKTaxi(x, y, z) {
            const taxiGroup = new THREE.Group();

            // Red Body
            const bodyGeo = new THREE.BoxGeometry(2.4, 1.1, 4.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd90429, roughness: 0.2, metalness: 0.4 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.8;
            body.castShadow = true;
            taxiGroup.add(body);

            // White Roof Top (HK Taxi Trademark)
            const roofGeo = new THREE.BoxGeometry(2.2, 0.9, 2.6);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0xf8f9fa, roughness: 0.2 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(0, 1.6, -0.2);
            taxiGroup.add(roof);

            // Yellow TAXI Light Bar on Roof
            const signGeo = new THREE.BoxGeometry(0.8, 0.3, 0.4);
            const signMat = new THREE.MeshBasicMaterial({ color: 0xffb703 });
            const sign = new THREE.Mesh(signGeo, signMat);
            sign.position.set(0, 2.15, -0.2);
            taxiGroup.add(sign);

            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            wheelGeo.rotateZ(Math.PI / 2);

            const wPositions = [
                [-1.2, 0.4, 1.5], [1.2, 0.4, 1.5],
                [-1.2, 0.4, -1.5], [1.2, 0.4, -1.5]
            ];
            wPositions.forEach(pos => {
                const w = new THREE.Mesh(wheelGeo, wheelMat);
                w.position.set(...pos);
                taxiGroup.add(w);
            });

            // Headlights
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const lightL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.1), lightMat);
            lightL.position.set(-0.8, 0.9, 2.41);
            const lightR = lightL.clone();
            lightR.position.x = 0.8;
            taxiGroup.add(lightL);
            taxiGroup.add(lightR);

            taxiGroup.position.set(x, y, z);
            scene.add(taxiGroup);

            const vehicleData = {
                mesh: taxiGroup,

            };

        }

        function spawnPoliceCar(x, y, z) {
            const polGroup = new THREE.Group();

            // White Sedan Body
            const bodyGeo = new THREE.BoxGeometry(2.4, 1.1, 4.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.8;
            polGroup.add(body);

            // Blue & Red HK Police Decal Side Stripe
            const stripeGeo = new THREE.BoxGeometry(2.42, 0.4, 4.82);
            const stripeMat = new THREE.MeshStandardMaterial({ color: 0x003049 });
            const stripe = new THREE.Mesh(stripeGeo, stripeMat);
            stripe.position.y = 0.8;
            polGroup.add(stripe);

            // Emergency Flashing Siren Lightbar
            const sirenGeo = new THREE.BoxGeometry(1.2, 0.25, 0.4);
            const sirenMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const siren = new THREE.Mesh(sirenGeo, sirenMat);
            siren.position.set(0, 1.85, 0);
            polGroup.add(siren);

            polGroup.position.set(x, y, z);
            scene.add(polGroup);

            const policeData = {
                mesh: polGroup,
                sirenMesh: siren,
                type: 'POLICE CAR',
                speed: 0,
                maxSpeed: 0.9,
                acceleration: 0.03,
                steering: 0.045,
                position: polGroup.position,
                rotation: polGroup.rotation
            };
            vehicles.push(policeData);
            policeCars.push(policeData);
            return policeData;
        }

        function updatePlayerMovement(delta) {
            if (isDriving) return;

            const moveSpeed = 0.25;
            let moveX = 0;
            let moveZ = 0;

            if (keys.w || keys.ArrowUp) moveZ -= 1;
            if (keys.s || keys.ArrowDown) moveZ += 1;
            if (keys.a || keys.ArrowLeft) moveX -= 1;
            if (keys.d || keys.ArrowRight) moveX += 1;

            if (moveX !== 0 || moveZ !== 0) {
                const angle = Math.atan2(moveX, moveZ);
                player.rotation.y = angle;

                player.position.x += Math.sin(angle) * moveSpeed;
                player.position.z += Math.cos(angle) * moveSpeed;
            }

            // Check distance to nearby vehicles for prompt
            checkNearbyVehicles();
        }

        function checkNearbyVehicles() {
            let foundVehicle = null;
            let minDist = 6.0;

            vehicles.forEach(v => {
                const dist = player.position.distanceTo(v.position);
                if (dist < minDist) {
                    minDist = dist;
                    foundVehicle = v;
                }
            });

            const prompt = document.getElementById('interaction-prompt');
            const promptText = document.getElementById('prompt-text');

            if (foundVehicle && !isDriving) {
                promptText.innerText = `DRIVE ${foundVehicle.type}`;
                prompt.classList.remove('opacity-0', 'translate-y-4');
                prompt.classList.add('opacity-100', 'translate-y-0');
            } else if (!isDriving) {
                prompt.classList.add('opacity-0', 'translate-y-4');
                prompt.classList.remove('opacity-100', 'translate-y-0');
            }
        }

        function toggleVehicleDrive() {
            initAudio();

            if (isDriving) {
                // Exit Vehicle
                isDriving = false;
                player.visible = true;
                player.position.set(
                    currentVehicle.position.x + 3,
                    0,
                    currentVehicle.position.z
                );
                currentVehicle = null;

                document.getElementById('speedometer-panel').classList.add('hidden');
                document.getElementById('interaction-prompt').classList.add('opacity-0');
                showToast("Exited Vehicle");
            } else {
                // Enter Vehicle
                let nearest = null;
                let minDist = 6.0;
                vehicles.forEach(v => {
                    const dist = player.position.distanceTo(v.position);
                    if (dist < minDist) {
                        minDist = dist;
                        nearest = v;
                    }
                });

                if (nearest) {
                    currentVehicle = nearest;
                    isDriving = true;
                    player.visible = false;

                    document.getElementById('speedometer-panel').classList.remove('hidden');
                    document.getElementById('vehicle-type-label').innerText = currentVehicle.type;
                    document.getElementById('interaction-prompt').classList.add('opacity-0');
                    showToast(`Driving ${currentVehicle.type}`);
                }
            }
        }

        function updateVehicleMovement(delta) {
            if (!isDriving || !currentVehicle) return;

            const v = currentVehicle;

            // Accelerate / Reverse
            if (keys.w || keys.ArrowUp) {
                v.speed = Math.min(v.speed + v.acceleration, v.maxSpeed);
            } else if (keys.s || keys.ArrowDown) {
                v.speed = Math.max(v.speed - v.acceleration, -v.maxSpeed * 0.5);
            } else {
                // Friction slowdown
                v.speed *= 0.95;
            }

            // Steering
            if (Math.abs(v.speed) > 0.02) {
                const dir = v.speed > 0 ? 1 : -1;
                if (keys.a || keys.ArrowLeft) v.rotation.y += v.steering * dir;
                if (keys.d || keys.ArrowRight) v.rotation.y -= v.steering * dir;
            }

            // Update Position
            v.position.x += Math.sin(v.rotation.y) * v.speed;
            v.position.z += Math.cos(v.rotation.y) * v.speed;

            // Sync Player position
            player.position.copy(v.position);

            // Update Speedometer UI
            const kmh = Math.round(Math.abs(v.speed) * 120);
            document.getElementById('speed-value').innerText = kmh;

            // Trigger wanted level if driving too fast or reckless
            if (kmh > 90 && Math.random() < 0.005) {
                addWantedLevel(1);
            }
        }

        function updatePoliceAI() {
            if (wantedLevel === 0) return;

            policeCars.forEach(pol => {
                const target = isDriving ? currentVehicle.position : player.position;
                const dist = pol.position.distanceTo(target);

                if (dist < 120) {
                    // Drive towards player
                    const angle = Math.atan2(target.x - pol.position.x, target.z - pol.position.z);
                    pol.rotation.y = angle;
                    pol.position.x += Math.sin(angle) * 0.4;
                    pol.position.z += Math.cos(angle) * 0.4;

                    // Flashing Siren
                    if (Math.floor(Date.now() / 200) % 2 === 0) {
                        pol.sirenMesh.material.color.setHex(0xff0000);
                    } else {
                        pol.sirenMesh.material.color.setHex(0x0000ff);
                    }

                    // Catch player
                    if (dist < 3.5) {
                        playerHealth = Math.max(0, playerHealth - 0.5);
                        document.getElementById('health-bar').style.width = `${playerHealth}%`;
                        if (playerHealth <= 0) {
                            showToast("BUSTED BY HK POLICE!");
                            setTimeout(() => {
                                playerHealth = 100;
                                wantedLevel = 0;
                                updateWantedStarsUI();
                                player.position.set(0, 0, 0);
                            }, 2000);
                        }
                    }
                }
            });
        }

        function addWantedLevel(amount) {
            wantedLevel = Math.min(5, wantedLevel + amount);
            updateWantedStarsUI();
            if (wantedLevel > 0) {
                showToast(`WANTED LEVEL ${wantedLevel} STARS!`);
            }
        }

        function updateWantedStarsUI() {
            const container = document.getElementById('stars-container');
            const stars = container.children;
            for (let i = 0; i < 5; i++) {
                if (i < wantedLevel) {
                    stars[i].className = "fa-solid fa-star text-yellow-400 neon-glow-yellow";
                } else {
                    stars[i].className = "fa-solid fa-star text-gray-700";
                }
            }
        }

        function initAudio() {
            if (isAudioStarted) return;
            Tone.start();
            isAudioStarted = true;

            // Cantopop Synth Melodic Player
            audioSynth = new Tone.PolySynth(Tone.Synth).toDestination();
            audioSynth.volume.value = -12;

            // Simple Cantopop Arpeggio
            const notes = ["C4", "E4", "G4", "A4", "B4", "C5"];
            let noteIdx = 0;
            setInterval(() => {
                if (isAudioStarted) {
                    audioSynth.triggerAttackRelease(notes[noteIdx % notes.length], "8n");
                    noteIdx++;
                }
            }, 400);
        }

        function cycleRadioStation() {
            initAudio();
            currentRadioIdx = (currentRadioIdx + 1) % radioStations.length;
            document.getElementById('radio-display').innerText = radioStations[currentRadioIdx];
            showToast(`Radio: ${radioStations[currentRadioIdx]}`);
        }

        function renderMinimap() {
            minimapCtx.clearRect(0, 0, 160, 160);

            // Dark Radar Background
            minimapCtx.fillStyle = '#0a0f1d';
            minimapCtx.fillRect(0, 0, 160, 160);

            // Grid Lines
            minimapCtx.strokeStyle = 'rgba(5, 217, 232, 0.2)';
            minimapCtx.lineWidth = 1;
            for (let i = 0; i < 160; i += 20) {
                minimapCtx.beginPath();
                minimapCtx.moveTo(i, 0); minimapCtx.lineTo(i, 160);
                minimapCtx.moveTo(0, i); minimapCtx.lineTo(160, i);
                minimapCtx.stroke();
            }

            const pX = player.position.x;
            const pZ = player.position.z;

            // Draw Vehicles as Red Dots
            vehicles.forEach(v => {
                const relX = 80 + (v.position.x - pX) * 0.5;
                const relY = 80 + (v.position.z - pZ) * 0.5;
                if (relX >= 0 && relX <= 160 && relY >= 0 && relY <= 160) {
                    minimapCtx.fillStyle = v.type === 'POLICE CAR' ? '#ff0055' : '#ffb703';
                    minimapCtx.beginPath();
                    minimapCtx.arc(relX, relY, 3, 0, Math.PI * 2);
                    minimapCtx.fill();
                }
            });
        }

        function setupEventListeners() {
            window.addEventListener('keydown', (e) => {
                if (keys.hasOwnProperty(e.key) || keys.hasOwnProperty(e.code)) {
                    keys[e.key] = true;
                    keys[e.code] = true;
                }
                if (e.key.toLowerCase() === 'e') toggleVehicleDrive();
                if (e.key.toLowerCase() === 'r') cycleRadioStation();
            });

            window.addEventListener('keyup', (e) => {
                if (keys.hasOwnProperty(e.key) || keys.hasOwnProperty(e.code)) {
                    keys[e.key] = false;
                    keys[e.code] = false;
                }
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.getElementById('btn-interact').addEventListener('click', toggleVehicleDrive);
            document.getElementById('btn-radio').addEventListener('click', cycleRadioStation);
        }

        function setupTouchControls() {
            const bindBtn = (id, keyName) => {
                const btn = document.getElementById(id);
                if (!btn) return;
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            };

            bindBtn('touch-left', 'ArrowLeft');
            bindBtn('touch-right', 'ArrowRight');
            bindBtn('touch-gas', 'w');
            bindBtn('touch-brake', 's');
        }

        function updateCamera() {
            const targetPos = player.position;
            const offset = isDriving ? new THREE.Vector3(0, 12, 22) : new THREE.Vector3(0, 8, 14);
            
            const desiredCamPos = targetPos.clone().add(offset);
            camera.position.lerp(desiredCamPos, 0.1);
            camera.lookAt(targetPos);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.add('opacity-0');
                toast.classList.remove('opacity-100');
            }, 2500);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // Update Mechanics
            updatePlayerMovement(delta);
            updateVehicleMovement(delta);
            updatePoliceAI();
            updateCamera();
            renderMinimap();

            // Render 3D Scene
            renderer.render(scene, camera);
        }

        // Initialize game on window load
        window.onload = function() {
            initEngine();
        };
    </script>
